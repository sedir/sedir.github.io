<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="refresh" content="0; url=/pt/now/" />
    <script type="text/javascript">
        // Detecção de idioma do navegador (simples)
        var lang = navigator.language || navigator.userLanguage;
        if (lang.startsWith("pt")) {
            window.location.href = "/pt/now/";
        } else {
            window.location.href = "/en/now/";
        }
    </script>
    <title>Redirecting...</title>
</head>

<body>
    <p>Redirecting to <a href="/pt/now/">/pt/now/</a>...</p>
</body>

</html>
